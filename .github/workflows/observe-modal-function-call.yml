name: Observe Modal function call

on:
  workflow_dispatch:
    inputs:
      call_id:
        description: Existing Modal FunctionCall object id
        required: true
        type: string

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    environment: dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check 'modal==1.5.5'
      - name: Observe existing call
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          CALL_ID: ${{ inputs.call_id }}
        run: |
          set -euo pipefail
          [[ "$CALL_ID" =~ ^fc-[A-Za-z0-9_-]{8,125}$ ]]
          python3 scripts/observe_modal_function_call.py \
            --call-id "$CALL_ID" --timeout 0 --output observation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: modal-function-call-observation-${{ github.run_id }}
          path: observation.json
          retention-days: 30
