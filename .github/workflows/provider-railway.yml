name: Deploy Railway provider

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      source_sha:
        required: true
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/provider-executor.yml
    # Railway is also a nested reusable workflow. Its CI token must be
    # forwarded explicitly to the executor when the top-level caller enables
    # this provider.
    secrets: inherit
    with:
      provider: railway
      environment: ${{ inputs.environment }}
      source_sha: ${{ inputs.source_sha }}
