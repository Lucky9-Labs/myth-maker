name: Provider deployment executor

on:
  workflow_call:
    inputs:
      provider:
        required: true
        type: string
      environment:
        required: true
        type: string
      source_sha:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment }}
    concurrency:
      group: myth-maker-deploy-${{ inputs.provider }}-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.0
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Derive and validate the trusted immutable main revision in this provider executor
        id: preflight
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          node scripts/deployment/controller.mjs assert-github-deployment
          printf 'started_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Run Cloudflare provider adapter without runtime credentials
        id: deploy
        if: inputs.provider == 'cloudflare'
        run: |
          set -euo pipefail
          node scripts/deployment/controller.mjs preview --event "$GITHUB_EVENT_NAME" --provider cloudflare --environment "$DEPLOYMENT_ENVIRONMENT"
          node scripts/deployment/controller.mjs deploy --provider cloudflare --environment "$DEPLOYMENT_ENVIRONMENT" > "$RUNNER_TEMP/provider-result.json"
          node -e 'const result = require(process.env.RESULT); process.stdout.write(`provider_status=${result.status}\n`)' >> "$GITHUB_OUTPUT"
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          RESULT: ${{ runner.temp }}/provider-result.json
      - name: Record unavailable Railway deployment without injecting credentials
        id: railway
        if: inputs.provider == 'railway'
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          RESULT: ${{ runner.temp }}/provider-result.json
        run: |
          set -euo pipefail
          node scripts/deployment/controller.mjs deploy --provider railway --environment "$DEPLOYMENT_ENVIRONMENT" > "$RESULT"
          node -e 'const result = require(process.env.RESULT); process.stdout.write(`provider_status=${result.status}\n`)' >> "$GITHUB_OUTPUT"
      - name: Write machine-readable receipt from provider output, never command exit alone
        if: always()
        shell: bash
        env:
          CLOUDFLARE_OUTCOME: ${{ steps.deploy.outcome }}
          CLOUDFLARE_STATUS: ${{ steps.deploy.outputs.provider_status }}
          RAILWAY_OUTCOME: ${{ steps.railway.outcome }}
          RAILWAY_STATUS: ${{ steps.railway.outputs.provider_status }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          PROVIDER: ${{ inputs.provider }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          STARTED_AT: ${{ steps.preflight.outputs.started_at }}
          RESULT: ${{ runner.temp }}/provider-result.json
        run: |
          set -euo pipefail
          case "$PROVIDER" in
            cloudflare) DEPLOY_OUTCOME="$CLOUDFLARE_OUTCOME"; PROVIDER_STATUS="$CLOUDFLARE_STATUS" ;;
            railway) DEPLOY_OUTCOME="$RAILWAY_OUTCOME"; PROVIDER_STATUS="$RAILWAY_STATUS" ;;
            *) DEPLOY_OUTCOME=failure; PROVIDER_STATUS=failure ;;
          esac
          status=failure
          if [[ "$PREFLIGHT_OUTCOME" == success && "$DEPLOY_OUTCOME" == success ]]; then
            case "$PROVIDER_STATUS" in
              deployed) status=success ;;
              skipped) status=skipped ;;
            esac
          fi
          started_at="${STARTED_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          details="$(node -e '
            const fs = require("node:fs");
            let result = {};
            try {
              const text = fs.existsSync(process.env.RESULT) ? fs.readFileSync(process.env.RESULT, "utf8").trim() : "";
              result = text ? JSON.parse(text) : {};
            } catch {
              result = { reason: "provider command did not produce parseable result" };
            }
            process.stdout.write(JSON.stringify(result.evidence ? { provider_evidence: result.evidence } : { reason: result.reason || "provider command did not produce verified evidence" }));
          ')"
          node scripts/deployment/controller.mjs receipt \
            --provider "$PROVIDER" \
            --environment "$DEPLOYMENT_ENVIRONMENT" \
            --source-sha "$SOURCE_SHA" \
            --status "$status" \
            --started-at "$started_at" \
            --completed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --verification "{\"trusted_github_context\":$([[ "$PREFLIGHT_OUTCOME" == success ]] && echo true || echo false),\"provider_command_outcome\":\"$DEPLOY_OUTCOME\",\"provider_result\":\"$PROVIDER_STATUS\"}" \
            --details "$details" \
            --output "receipts/$PROVIDER-$DEPLOYMENT_ENVIRONMENT.json"
      - name: Upload deployment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-receipt-${{ inputs.provider }}-${{ inputs.environment }}-${{ inputs.source_sha }}
          path: receipts/${{ inputs.provider }}-${{ inputs.environment }}.json
          if-no-files-found: error
          retention-days: 30
