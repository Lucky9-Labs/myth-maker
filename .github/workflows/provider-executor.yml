name: Provider deployment executor

on:
  workflow_call:
    inputs:
      provider:
        required: true
        type: string
      environment:
        required: true
        type: string
      source_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment }}
    concurrency:
      group: myth-maker-deploy-${{ inputs.provider }}-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.0
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
      - name: Assert an immutable clean checked-out revision
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
          git diff --exit-code
          git diff --cached --exit-code
          printf 'started_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Deploy Cloudflare through the provider adapter
        id: deploy
        if: inputs.provider == 'cloudflare'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_agent_ingress_token: ${{ secrets.TF_VAR_agent_ingress_token }}
          TF_VAR_work_dispatch_token: ${{ secrets.TF_VAR_work_dispatch_token }}
          EVENT_NAME: ${{ github.event_name }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
        run: node scripts/deployment/controller.mjs deploy --event "$EVENT_NAME" --provider cloudflare --environment "$DEPLOYMENT_ENVIRONMENT"
      - name: Verify Railway foundation through the provider adapter
        id: railway
        if: inputs.provider == 'railway'
        env:
          TF_VAR_railway_token: ${{ secrets.TF_VAR_railway_token }}
          WORK_DISPATCH_TOKEN: ${{ secrets.WORK_DISPATCH_TOKEN }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
        run: node scripts/deployment/controller.mjs deploy --event "$EVENT_NAME" --provider railway --environment "$DEPLOYMENT_ENVIRONMENT"
      - name: Deploy Modal through the provider adapter
        id: modal
        if: inputs.provider == 'modal'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
        run: node scripts/deployment/controller.mjs deploy --event "$EVENT_NAME" --provider modal --environment "$DEPLOYMENT_ENVIRONMENT"
      - name: Write machine-readable receipt
        if: always()
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome || steps.railway.outcome || steps.modal.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          PROVIDER: ${{ inputs.provider }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          status=failure
          if [[ "$DEPLOY_OUTCOME" == success ]]; then status=success; fi
          # Terraform is the sole Cloudflare deployment authority. This wrapper
          # publishes a non-success placeholder until its managed IDs/facts are
          # joined into a provider receipt, rather than inventing a Wrangler ID.
          if [[ "$PROVIDER" == cloudflare ]]; then status=skipped; fi
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          checkout_clean=false
          if [[ "$PREFLIGHT_OUTCOME" == success ]]; then checkout_clean=true; fi
          node scripts/deployment/controller.mjs receipt \
            --provider "$PROVIDER" \
            --environment "$DEPLOYMENT_ENVIRONMENT" \
            --source-sha "$SOURCE_SHA" \
            --status "$status" \
            --started-at '${{ steps.preflight.outputs.started_at }}' \
            --completed-at "$completed_at" \
            --verification "{\"checkout_clean\":$checkout_clean,\"provider_command_outcome\":\"$DEPLOY_OUTCOME\"}" \
            --output "receipts/$PROVIDER-$DEPLOYMENT_ENVIRONMENT.json"
      - name: Upload deployment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-receipt-${{ inputs.provider }}-${{ inputs.environment }}-${{ inputs.source_sha }}
          path: receipts/${{ inputs.provider }}-${{ inputs.environment }}.json
          if-no-files-found: error
          retention-days: 30
