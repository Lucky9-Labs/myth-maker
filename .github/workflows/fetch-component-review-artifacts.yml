name: Fetch component review artifacts

on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
      work_id:
        required: true
        type: string
      attempt:
        required: true
        type: number

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    environment: dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check 'modal==1.5.5'
      - name: Fetch immutable component review renders
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          RUN_ID: ${{ inputs.run_id }}
          WORK_ID: ${{ inputs.work_id }}
          ATTEMPT: ${{ inputs.attempt }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[a-z0-9][a-z0-9-]{0,95}$ ]]
          [[ "$WORK_ID" =~ ^[a-z0-9][a-z0-9-]{0,95}$ ]]
          [[ "$ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          printf -v attempt_dir 'attempt-%04d' "$ATTEMPT"
          remote="asset-production/$RUN_ID/component-reviews/$WORK_ID/$attempt_dir/renders"
          mkdir -p fetched
          modal volume get --env dev --force myth-maker-encounter-submissions "$remote" fetched/
          test -s fetched/three-quarter.png
          test -s fetched/front.png
          test -s fetched/side.png
          sha256sum fetched/three-quarter.png fetched/front.png fetched/side.png > fetched/sha256sums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: component-review-artifacts-${{ github.run_id }}
          path: fetched/
          retention-days: 30
