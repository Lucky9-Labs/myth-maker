name: Reef Skitter cloud GUI integration

on:
  workflow_dispatch:
    inputs:
      modal_deployment_run_id:
        description: Successful main deployment run containing the hash-matched Modal deployment receipt
        required: true
        type: string
      source_animation_run_id:
        description: Prior animation run containing the accepted rig and all five accepted clip artifacts
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  REEF_REFERENCE: assets/reef-skitter/references/swarm-overview.png
  REEF_REFERENCE_SHA256: 9e056f73266acd2a3abd3923e3cc5df9d8dac9eb8641d8e4fce53b7338d46ed5

jobs:
  integrate-and-verify:
    runs-on: ubuntu-24.04
    environment: dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the pinned Modal control-plane client
        run: python3 -m pip install --disable-pip-version-check 'modal==1.5.5'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.modal_deployment_run_id }}
          pattern: deployment-receipt-modal-dev-${{ github.sha }}
          path: deployment-receipt
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_animation_run_id }}
          pattern: reef-skitter-rig-${{ inputs.source_animation_run_id }}-*
          path: rig-artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_animation_run_id }}
          pattern: reef-skitter-clip-*-${{ inputs.source_animation_run_id }}-*
          path: clip-artifacts
      - uses: ./.github/actions/setup-blender-gui
      - name: Integrate, reopen, export, and reimport on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          SOURCE_ANIMATION_RUN_ID: ${{ inputs.source_animation_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_ANIMATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          printf '%s  %s\n' "$REEF_REFERENCE_SHA256" "$REEF_REFERENCE" | sha256sum --check --strict
          rig_artifact="$(python3 scripts/resolve_github_animation_artifact.py rig-artifacts "reef-skitter-rig-$SOURCE_ANIMATION_RUN_ID")"
          rig_receipt="$rig_artifact/receipts/reef-skitter-rig.json"
          rig_id="$(python3 scripts/resolve_github_animation_work_id.py "$rig_receipt" --prefix reef-rig-)"
          rig_root="$(python3 scripts/resolve_github_animation_job_root.py "$rig_receipt" "$rig_artifact/evidence/rig")"
          source_scene="$rig_root/output/$rig_id.blend"
          test -s "$source_scene"
          python3 scripts/verify_cloud_gui_animation_artifacts.py \
            --receipt "$rig_receipt" --artifact-dir "$rig_root" \
            --output "$rig_id.blend=output/$rig_id.blend" \
            --output "${rig_id}_preview.png=output/${rig_id}_preview.png" \
            --frame initial=screenshots/000-initial.png --frame latest=latest.png --frame final=final-desktop.png
          args=()
          for clip in idle walk run attack death; do
            clip_id="reef-${clip}-${SOURCE_ANIMATION_RUN_ID}"
            prefix="reef-skitter-clip-${clip}-${SOURCE_ANIMATION_RUN_ID}"
            artifact="$(python3 scripts/resolve_github_animation_artifact.py clip-artifacts "$prefix")"
            clip_receipt="$artifact/receipts/reef-skitter-clip-$clip.json"
            clip_root="$(python3 scripts/resolve_github_animation_job_root.py "$clip_receipt" "$artifact/evidence/$clip")"
            native="$clip_root/output/$clip_id.blend"
            test -s "$native"
            verify_args=()
            for raw_index in $(seq 0 39); do
              index="$(printf '%03d' "$raw_index")"
              verify_args+=(--frame "motion-$index=motion/frame-$index.png")
            done
            python3 scripts/verify_cloud_gui_animation_artifacts.py \
              --receipt "$clip_receipt" --artifact-dir "$clip_root" \
              --output "$clip_id.blend=output/$clip_id.blend" \
              --output "${clip_id}_preview.png=output/${clip_id}_preview.png" \
              --frame initial=screenshots/000-initial.png --frame latest=latest.png --frame final=final-desktop.png \
              "${verify_args[@]}"
            python3 scripts/verify_animation_motion.py --frame-dir "$clip_root/motion" --minimum-frames 40 \
              --output "$clip_root/motion-verification.json"
            args+=(--input "dependency-$clip.blend=$native")
          done
          integration_id="reef-integrated-${GITHUB_RUN_ID}"
          "$pythonLocation/bin/python3" scripts/run_cloud_gui_animation_job.py \
            --environment dev --project-id reef-skitter-animation --run-scope "run-${GITHUB_RUN_ID}" \
            --work-id "$integration_id" --attempt "$GITHUB_RUN_ATTEMPT" --lane animation-integration \
            --deployment-receipt deployment-receipt/modal-dev.json \
            --artifact-root evidence/final --max-continuations 2 \
            --instruction "Open the immutable canonical rig through Blender's visible GUI. Append only the Action from each of the five immutable dependency blend files. Reject any dependency that changes the rig, mesh bindings, materials, or rest pose. The exact Action set must be idle, walk, run, attack, death. Reopen the saved integrated blend through the GUI, inspect and play representative start/middle/end frames of every Action, then export an animated GLB through File > Export > glTF 2.0 to /output/reef-skitter-animation-integrated.glb. Start a fresh Blender scene, reimport that GLB through File > Import > glTF 2.0, verify the five Actions and all 15 mesh parts remain present, then save the integrated native through the GUI and finish READY_FOR_REVIEW. Do not use Python or scripts." \
            --input "source_scene.blend=$source_scene" "${args[@]}" \
            --input "structure_reference.png=$REEF_REFERENCE" \
            --input "component_reference.png=$REEF_REFERENCE" \
            --input "primary_artwork.png=$REEF_REFERENCE" \
            --input "concept_reference.png=$REEF_REFERENCE" \
            --output receipts/reef-skitter-animation-integrated.json
          job_root="$(python3 scripts/resolve_github_animation_job_root.py receipts/reef-skitter-animation-integrated.json evidence/final)"
          blender --background "$job_root/output/$integration_id.blend" --python scripts/inspect_blender_animation.py -- \
            --stage integration --output "$job_root/blender-inspection.json"
          python3 scripts/verify_cloud_gui_animation_artifacts.py \
            --receipt receipts/reef-skitter-animation-integrated.json --artifact-dir "$job_root" \
            --output "$integration_id.blend=output/$integration_id.blend" \
            --output reef-skitter-animation-integrated.glb=output/reef-skitter-animation-integrated.glb \
            --output "${integration_id}_preview.png=output/${integration_id}_preview.png" \
            --frame initial=screenshots/000-initial.png --frame latest=latest.png --frame final=final-desktop.png
          node scripts/inspect-animated-parted-glb.mjs \
            "$job_root/output/reef-skitter-animation-integrated.glb" > "$job_root/animation-inspection.json"
      - id: upload-evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && hashFiles('receipts/reef-skitter-animation-integrated.json') != ''
        with:
          name: reef-skitter-animation-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            receipts/reef-skitter-animation-integrated.json
            evidence/final/
          if-no-files-found: error
          retention-days: 30
