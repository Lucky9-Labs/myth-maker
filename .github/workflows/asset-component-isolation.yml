name: Isolate asset component reference

on:
  workflow_dispatch:
    inputs:
      job:
        description: Closed component-isolation job JSON
        required: true
        type: string

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-24.04
    environment: dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check 'modal==1.5.5'
      - name: Generate immutable isolated component reference
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          JOB: ${{ inputs.job }}
        run: python3 scripts/run_component_isolation.py --environment dev --job-json "$JOB" --output receipts/component-isolation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: component-isolation-${{ github.run_id }}
          path: receipts/component-isolation.json
          retention-days: 30
