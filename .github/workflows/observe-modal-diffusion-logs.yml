name: Observe Modal diffusion system logs

on:
  workflow_dispatch:
    inputs:
      function_id:
        description: Exact deployed component-diffusion function ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    environment: dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check 'modal==1.5.5'
      - name: Fetch bounded provider logs for the diffusion function
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          FUNCTION_ID: ${{ inputs.function_id }}
        run: |
          set -euo pipefail
          [[ "$FUNCTION_ID" =~ ^fu-[A-Za-z0-9]+$ ]]
          modal app logs myth-maker-encounter-draft \
            --env dev \
            --function "$FUNCTION_ID" \
            --since 2h \
            --tail 500 \
            --timestamps \
            --show-function-id \
            > modal-diffusion.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: modal-diffusion-logs-${{ github.run_id }}
          path: modal-diffusion.log
          retention-days: 30
