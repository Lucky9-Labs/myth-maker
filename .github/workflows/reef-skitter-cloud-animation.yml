name: Reef Skitter cloud GUI animation

on:
  workflow_dispatch:
    inputs:
      modal_deployment_run_id:
        description: Successful main deployment run containing the hash-matched Modal deployment receipt
        required: true
        type: string
      rig_seed_run_id:
        description: Optional prior GitHub Actions run containing a resumable Reef Skitter rig checkpoint
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  REEF_SOURCE: assets/reef-skitter/source/reef_skitter.tripo.glb
  REEF_REFERENCE: assets/reef-skitter/references/swarm-overview.png
  REEF_SOURCE_SHA256: 984eec1c52d4a8774f8beae3b794b3fa0f1805f41b7266c19fd2d62fad27d673
  REEF_REFERENCE_SHA256: 9e056f73266acd2a3abd3923e3cc5df9d8dac9eb8641d8e4fce53b7338d46ed5

jobs:
  rig:
    runs-on: ubuntu-24.04
    environment: dev
    outputs:
      rig-id: ${{ steps.author.outputs.rig-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the pinned Modal control-plane client
        run: python3 -m pip install --disable-pip-version-check 'modal==1.5.5'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.modal_deployment_run_id }}
          pattern: deployment-receipt-modal-dev-${{ github.sha }}
          path: deployment-receipt
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.rig_seed_run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.rig_seed_run_id }}
          pattern: reef-skitter-rig-${{ inputs.rig_seed_run_id }}-*
          path: rig-seed-artifacts
      - uses: ./.github/actions/setup-blender-gui
      - id: author
        name: Author and reopen the canonical rig on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          RIG_SEED_RUN_ID: ${{ inputs.rig_seed_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          printf '%s  %s\n' "$REEF_SOURCE_SHA256" "$REEF_SOURCE" | sha256sum --check --strict
          printf '%s  %s\n' "$REEF_REFERENCE_SHA256" "$REEF_REFERENCE" | sha256sum --check --strict
          rig_id="reef-rig-${GITHUB_RUN_ID}"
          resume_args=()
          if [[ -n "$RIG_SEED_RUN_ID" ]]; then
            seed_artifact="$(python3 scripts/resolve_github_animation_artifact.py rig-seed-artifacts "reef-skitter-rig-$RIG_SEED_RUN_ID")"
            rig_id="$(python3 scripts/resolve_github_animation_resume.py "$seed_artifact" "$RIG_SEED_RUN_ID" --field work-id)"
            seed_job_dir="$(python3 scripts/resolve_github_animation_resume.py "$seed_artifact" "$RIG_SEED_RUN_ID" --field job-dir)"
            resume_args+=(--resume-job-dir "$seed_job_dir")
            seed_provider="$(python3 scripts/resolve_github_animation_resume.py "$seed_artifact" "$RIG_SEED_RUN_ID" --field provider)"
            if [[ "$seed_provider" == modal ]]; then resume_args+=(--resume-already-staged); fi
          fi
          "$pythonLocation/bin/python3" scripts/run_cloud_gui_animation_job.py \
            --environment dev --project-id reef-skitter-animation --run-scope "run-${GITHUB_RUN_ID}" \
            --work-id "$rig_id" --attempt "$GITHUB_RUN_ATTEMPT" --lane animation-rig \
            --deployment-receipt deployment-receipt/receipts/modal-dev.json \
            --artifact-root evidence/rig --max-continuations 2 "${resume_args[@]}" \
            --instruction "Import the immutable Reef Skitter GLB through the visible Blender GUI. Preserve all 15 provider-authored mesh parts and materials without segmentation. Determine the source-derived locomotor limb count from the visible geometry before finalizing the rigid-part rig. Do not invent missing limbs. The hash-bound source inspection establishes that tripo_part_6 has two welded disconnected regions: a 644-triangle region centered near (-0.113,0.141,0.056) and a 334-triangle region centered near (-0.224,0.189,-0.064). Isolate and classify both regions visibly. If they need different bones, assign them with vertex groups without splitting the provider object. Bind every actual locomotor limb and articulated appendage, pose-test each independently, return to a neutral rest pose, and save through the GUI. A bone moving without its intended mesh is a blocking binding defect: identify the intended provider mesh or disconnected rigid region using the visible geometry, repair the binding before continuing the audit, and retest it in motion. An unreadable reference pane is not a blocker; use the visible creature geometry and existing verified bindings while preserving meshes and materials. Reopen that saved native through File > Open, verify the rig and all bindings survived, and leave the rig and Outliner visible as final evidence. Do not author animation clips. End READY_FOR_REVIEW only after save and reopen succeed." \
            --input "source_asset.glb=$REEF_SOURCE" \
            --input "structure_reference.png=$REEF_REFERENCE" \
            --input "component_reference.png=$REEF_REFERENCE" \
            --input "primary_artwork.png=$REEF_REFERENCE" \
            --input "concept_reference.png=$REEF_REFERENCE" \
            --output receipts/reef-skitter-rig.json
          job_root="$(python3 scripts/resolve_github_animation_job_root.py receipts/reef-skitter-rig.json evidence/rig)"
          blender --background "$job_root/output/$rig_id.blend" --python scripts/inspect_blender_animation.py -- \
            --stage rig --output "$job_root/blender-inspection.json"
          python3 scripts/verify_cloud_gui_animation_artifacts.py \
            --receipt receipts/reef-skitter-rig.json --artifact-dir "$job_root" \
            --output "$rig_id.blend=output/$rig_id.blend" \
            --output "${rig_id}_preview.png=output/${rig_id}_preview.png" \
            --frame initial=screenshots/000-initial.png --frame latest=latest.png --frame final=final-desktop.png
          echo "rig-id=$rig_id" >> "$GITHUB_OUTPUT"
      - id: upload-evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && hashFiles('receipts/reef-skitter-rig.json') != ''
        with:
          name: reef-skitter-rig-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            receipts/reef-skitter-rig.json
            evidence/rig/
          if-no-files-found: error
          retention-days: 30

  clips:
    needs: rig
    runs-on: ubuntu-24.04
    environment: dev
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - clip: idle
            instruction: "Author only an in-place looping idle Action named idle. Make breathing, feeler, and subtle leg motion readable."
          - clip: walk
            instruction: "Author only an in-place looping scuttle Action named walk. Use a stable alternating contact pattern appropriate to the source-derived locomotor limb count and no root translation."
          - clip: run
            instruction: "Author only an in-place looping fast scuttle Action named run, using the source-derived locomotor limb count with a faster cadence and stronger body compression than walk."
          - clip: attack
            instruction: "Author only a non-looping in-place pounce/strike Action named attack, with clear anticipation, contact, and recovery and idle-compatible endpoints."
          - clip: death
            instruction: "Author only a non-looping in-place death-curl Action named death, ending in a stable terminal curled pose with no recovery."
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the pinned Modal control-plane client
        run: python3 -m pip install --disable-pip-version-check 'modal==1.5.5'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.modal_deployment_run_id }}
          pattern: deployment-receipt-modal-dev-${{ github.sha }}
          path: deployment-receipt
          merge-multiple: true
      - uses: ./.github/actions/setup-blender-gui
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: reef-skitter-rig-${{ github.run_id }}-*
          path: rig-artifacts
      - name: Author, reopen, play, and capture one isolated clip on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          CLIP: ${{ matrix.clip }}
          CLIP_INSTRUCTION: ${{ matrix.instruction }}
        run: |
          set -euo pipefail
          rig_id="${{ needs.rig.outputs.rig-id }}"
          clip_id="reef-${CLIP}-${GITHUB_RUN_ID}"
          rig_artifact="$(python3 scripts/resolve_github_animation_artifact.py rig-artifacts "reef-skitter-rig-${GITHUB_RUN_ID}")"
          rig_root="$(python3 scripts/resolve_github_animation_job_root.py "$rig_artifact/receipts/reef-skitter-rig.json" "$rig_artifact/evidence/rig")"
          source_scene="$rig_root/output/$rig_id.blend"
          test -s "$source_scene"
          "$pythonLocation/bin/python3" scripts/run_cloud_gui_animation_job.py \
            --environment dev --project-id reef-skitter-animation --run-scope "run-${GITHUB_RUN_ID}" \
            --work-id "$clip_id" --attempt "$GITHUB_RUN_ATTEMPT" --lane animation-clip \
            --deployment-receipt deployment-receipt/receipts/modal-dev.json \
            --artifact-root "evidence/$CLIP" --motion-capture-frames 40 --max-continuations 2 \
            --instruction "Open the canonical Reef Skitter rig through Blender's visible GUI. $CLIP_INSTRUCTION Preserve the exact armature, rest pose, 15 mesh bindings, materials, and root transform. Save and reopen through the GUI, inspect the Action at start, middle, and end, then leave the Action playing in the viewport before ending READY_FOR_REVIEW. Do not use Python or scripts." \
            --input "source_scene.blend=$source_scene" \
            --input "structure_reference.png=$REEF_REFERENCE" \
            --input "component_reference.png=$REEF_REFERENCE" \
            --input "primary_artwork.png=$REEF_REFERENCE" \
            --input "concept_reference.png=$REEF_REFERENCE" \
            --output "receipts/reef-skitter-clip-$CLIP.json"
          job_root="$(python3 scripts/resolve_github_animation_job_root.py "receipts/reef-skitter-clip-$CLIP.json" "evidence/$CLIP")"
          blender --background "$job_root/output/$clip_id.blend" --python scripts/inspect_blender_animation.py -- \
            --stage clip --expected-clip "$CLIP" --output "$job_root/blender-inspection.json"
          verify_args=()
          for raw_index in $(seq 0 39); do
            index="$(printf '%03d' "$raw_index")"
            verify_args+=(--frame "motion-$index=motion/frame-$index.png")
          done
          python3 scripts/verify_cloud_gui_animation_artifacts.py \
            --receipt "receipts/reef-skitter-clip-$CLIP.json" --artifact-dir "$job_root" \
            --output "$clip_id.blend=output/$clip_id.blend" \
            --output "${clip_id}_preview.png=output/${clip_id}_preview.png" \
            --frame initial=screenshots/000-initial.png --frame latest=latest.png --frame final=final-desktop.png \
            "${verify_args[@]}"
          python3 scripts/verify_animation_motion.py --frame-dir "$job_root/motion" --minimum-frames 40 \
            --output "$job_root/motion-verification.json"
          ffmpeg -hide_banner -loglevel error -y -framerate 8 -i "$job_root/motion/frame-%03d.png" -t 5 \
            -vf "fps=8,scale=960:-1:flags=lanczos,split[s0][s1];[s0]palettegen=stats_mode=diff[p];[s1][p]paletteuse=dither=bayer:bayer_scale=3" \
            "$job_root/$CLIP.gif"
          test -s "$job_root/$CLIP.gif"
      - id: upload-evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && hashFiles(format('receipts/reef-skitter-clip-{0}.json', matrix.clip)) != ''
        with:
          name: reef-skitter-clip-${{ matrix.clip }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            receipts/reef-skitter-clip-${{ matrix.clip }}.json
            evidence/${{ matrix.clip }}/
          if-no-files-found: error
          retention-days: 30

  integrate-and-verify:
    needs: clips
    runs-on: ubuntu-24.04
    environment: dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the pinned Modal control-plane client
        run: python3 -m pip install --disable-pip-version-check 'modal==1.5.5'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.modal_deployment_run_id }}
          pattern: deployment-receipt-modal-dev-${{ github.sha }}
          path: deployment-receipt
          merge-multiple: true
      - uses: ./.github/actions/setup-blender-gui
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: reef-skitter-rig-${{ github.run_id }}-*
          path: rig-artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: reef-skitter-clip-*-${{ github.run_id }}-*
          path: clip-artifacts
      - name: Integrate, reopen, export, and reimport on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          rig_id="${{ needs.rig.outputs.rig-id }}"
          integration_id="reef-integrated-${GITHUB_RUN_ID}"
          rig_artifact="$(python3 scripts/resolve_github_animation_artifact.py rig-artifacts "reef-skitter-rig-${GITHUB_RUN_ID}")"
          rig_root="$(python3 scripts/resolve_github_animation_job_root.py "$rig_artifact/receipts/reef-skitter-rig.json" "$rig_artifact/evidence/rig")"
          source_scene="$rig_root/output/$rig_id.blend"
          test -s "$source_scene"
          args=()
          for clip in idle walk run attack death; do
            clip_id="reef-${clip}-${GITHUB_RUN_ID}"
            prefix="reef-skitter-clip-${clip}-${GITHUB_RUN_ID}"
            artifact="$(python3 scripts/resolve_github_animation_artifact.py clip-artifacts "$prefix")"
            clip_root="$(python3 scripts/resolve_github_animation_job_root.py "$artifact/receipts/reef-skitter-clip-$clip.json" "$artifact/evidence/$clip")"
            native="$clip_root/output/$clip_id.blend"
            test -s "$native"
            args+=(--input "dependency-$clip.blend=$native")
          done
          "$pythonLocation/bin/python3" scripts/run_cloud_gui_animation_job.py \
            --environment dev --project-id reef-skitter-animation --run-scope "run-${GITHUB_RUN_ID}" \
            --work-id "$integration_id" --attempt "$GITHUB_RUN_ATTEMPT" --lane animation-integration \
            --deployment-receipt deployment-receipt/receipts/modal-dev.json \
            --artifact-root evidence/final --max-continuations 2 \
            --instruction "Open the immutable canonical rig through Blender's visible GUI. Append only the Action from each of the five immutable dependency blend files. Reject any dependency that changes the rig, mesh bindings, materials, or rest pose. The exact Action set must be idle, walk, run, attack, death. Reopen the saved integrated blend through the GUI, inspect and play representative start/middle/end frames of every Action, then export an animated GLB through File > Export > glTF 2.0 to /output/reef-skitter-animation-integrated.glb. Start a fresh Blender scene, reimport that GLB through File > Import > glTF 2.0, verify the five Actions and all 15 mesh parts remain present, then save the integrated native through the GUI and finish READY_FOR_REVIEW. Do not use Python or scripts." \
            --input "source_scene.blend=$source_scene" "${args[@]}" \
            --input "structure_reference.png=$REEF_REFERENCE" \
            --input "component_reference.png=$REEF_REFERENCE" \
            --input "primary_artwork.png=$REEF_REFERENCE" \
            --input "concept_reference.png=$REEF_REFERENCE" \
            --output receipts/reef-skitter-animation-integrated.json
          job_root="$(python3 scripts/resolve_github_animation_job_root.py receipts/reef-skitter-animation-integrated.json evidence/final)"
          blender --background "$job_root/output/$integration_id.blend" --python scripts/inspect_blender_animation.py -- \
            --stage integration --output "$job_root/blender-inspection.json"
          python3 scripts/verify_cloud_gui_animation_artifacts.py \
            --receipt receipts/reef-skitter-animation-integrated.json --artifact-dir "$job_root" \
            --output "$integration_id.blend=output/$integration_id.blend" \
            --output reef-skitter-animation-integrated.glb=output/reef-skitter-animation-integrated.glb \
            --output "${integration_id}_preview.png=output/${integration_id}_preview.png" \
            --frame initial=screenshots/000-initial.png --frame latest=latest.png --frame final=final-desktop.png
          node scripts/inspect-animated-parted-glb.mjs \
            "$job_root/output/reef-skitter-animation-integrated.glb" > "$job_root/animation-inspection.json"
      - id: upload-evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && hashFiles('receipts/reef-skitter-animation-integrated.json') != ''
        with:
          name: reef-skitter-animation-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            receipts/reef-skitter-animation-integrated.json
            evidence/final/
          if-no-files-found: error
          retention-days: 30
