name: Deploy Modal provider

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      source_sha:
        required: true
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/provider-executor.yml
    # Preserve the explicit caller secret scope across the second reusable
    # workflow hop; the executor itself is where the dev environment binds.
    secrets: inherit
    with:
      provider: modal
      environment: ${{ inputs.environment }}
      source_sha: ${{ inputs.source_sha }}
