name: Reset Modal component queue

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: myth-maker-reset-modal-component-queue-dev
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-24.04
    environment: dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify trusted main revision
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          node scripts/deployment/controller.mjs assert-github-deployment
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check 'modal==1.5.5'
      - name: Stop retained component inputs and redeploy the same revision
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODAL_IMAGE_BUILDER_VERSION: '2024.04'
          MODAL_EVIDENCE_PATH: ${{ runner.temp }}/modal-reset-evidence.json
          RESET_RECEIPT: ${{ runner.temp }}/modal-reset-receipt.json
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          modal app stop myth-maker-encounter-draft --env dev
          python3 - <<'PY'
          import json, os, subprocess
          apps=json.loads(subprocess.run(
              ["modal","app","list","--env","dev","--json"],
              check=True,text=True,capture_output=True).stdout)
          active=[a for a in apps if a.get("description",a.get("Description"))=="myth-maker-encounter-draft"
                  and a.get("state",a.get("State"))=="deployed"]
          if active:
              raise SystemExit("Modal app remained deployed after stop")
          PY
          node scripts/deployment/controller.mjs deploy --provider modal --environment dev > "${{ runner.temp }}/provider-result.json"
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - "$started_at" "$completed_at" <<'PY'
          import json, os, pathlib, sys
          result=json.loads(pathlib.Path(os.environ["RUNNER_TEMP"]).joinpath("provider-result.json").read_text())
          if result.get("status") != "deployed":
              raise SystemExit("Modal redeployment did not complete")
          receipt={"format":"myth-maker.modal-component-queue-reset/v1","status":"completed",
                   "source_sha":os.environ["GITHUB_SHA"],"app":"myth-maker-encounter-draft",
                   "environment":"dev","started_at":sys.argv[1],"completed_at":sys.argv[2],
                   "provider_result":result}
          pathlib.Path(os.environ["RESET_RECEIPT"]).write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: modal-component-queue-reset-${{ github.run_id }}
          path: ${{ runner.temp }}/modal-reset-receipt.json
          if-no-files-found: error
          retention-days: 30
