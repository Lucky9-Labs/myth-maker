name: Observed Modal Blender demo

on:
  workflow_run:
    workflows: [CI-owned deployment]
    types: [completed]

permissions:
  contents: read

concurrency:
  # Observe only the immutable app version deployed by the trusted main CI.
  group: myth-maker-observed-modal-dev
  cancel-in-progress: false

jobs:
  draft:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    environment:
      name: dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the pinned Modal client
        run: python3 -m pip install --disable-pip-version-check 'modal==1.5.5'
      - name: Submit the bounded provider-observed Blender work order
        id: draft
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          OBSERVED_MODAL_JOB_ID: deterministic-encounter-demo-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/observed_modal_blender_demo.py
      - name: Retrieve provider-persisted source and Blender frames
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          JOB_ID: ${{ steps.draft.outputs.job_id }}
          WORK_ID: ${{ steps.draft.outputs.work_id }}
        run: |
          set -euo pipefail
          mkdir -p provider-evidence/modal-blender-demo
          modal volume get myth-maker-encounter-submissions "$JOB_ID/output/$WORK_ID.blend" provider-evidence/modal-blender-demo/source.blend --env dev
          modal volume get myth-maker-encounter-submissions "$JOB_ID/output/$WORK_ID.glb" provider-evidence/modal-blender-demo/encounter.glb --env dev
          modal volume get myth-maker-encounter-submissions "$JOB_ID/frames/000-initial.png" provider-evidence/modal-blender-demo/initial.png --env dev
          modal volume get myth-maker-encounter-submissions "$JOB_ID/frames/010-appendages.png" provider-evidence/modal-blender-demo/intermediate.png --env dev
          modal volume get myth-maker-encounter-submissions "$JOB_ID/frames/020-final.png" provider-evidence/modal-blender-demo/final.png --env dev
      - name: Verify downloaded provider bytes against the terminal receipt
        run: python3 scripts/verify_observed_modal_artifacts.py --receipt provider-evidence/modal-blender-demo-receipt.json --artifact-dir provider-evidence/modal-blender-demo
      - name: Upload observed Modal Blender evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: observed-modal-blender-demo-${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}
          path: provider-evidence/
          if-no-files-found: error
          retention-days: 30
