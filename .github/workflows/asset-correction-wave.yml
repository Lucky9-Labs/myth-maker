name: Run asset correction wave

on:
  workflow_dispatch:
    inputs:
      apply_reference_batch:
        description: Apply the currently deployed versioned geometry batch
        required: false
        default: false
        type: boolean
      reference_batch_slot:
        description: Restrict the geometry batch to one component lane
        required: false
        default: ''
        type: choice
        options: ['', 'worker-a', 'worker-b', 'worker-c', 'worker-a+worker-b']
      correction_spec:
        description: Validated geometry-correction JSON for the selected lane
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: raptor-mech-railgun-correction-dev
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-24.04
    environment: dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned Modal client
        run: python3 -m pip install --disable-pip-version-check 'modal==1.5.5'
      - name: Run immutable correction lanes and assembly
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          SOURCE_SHA: ${{ github.sha }}
          CORRECTION_SPEC: ${{ inputs.correction_spec }}
        run: |
          set -euo pipefail
          python3 scripts/run_asset_correction_wave.py \
            --environment dev \
            --run-id raptor-mech-railgun-pilot-001 \
            --source-sha "$SOURCE_SHA" \
            ${{ inputs.apply_reference_batch && '--apply-reference-batch' || '' }} \
            ${{ inputs.reference_batch_slot && format('--reference-batch-slot {0}', inputs.reference_batch_slot) || '' }} \
            --output receipts/asset-correction-wave.json
      - name: Upload correction receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: raptor-mech-railgun-correction-${{ github.run_id }}
          path: receipts/asset-correction-wave.json
          if-no-files-found: warn
          retention-days: 30
