name: CI-owned deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment for an immutable main retry; pushes use dev
        required: false
        type: choice
        options: [dev, staging, production]

permissions:
  contents: read

concurrency:
  group: myth-maker-release-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  assert-deployment-input:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.trust.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Derive and validate the trusted immutable main revision
        id: trust
        shell: bash
        run: |
          set -euo pipefail
          node scripts/deployment/controller.mjs assert-github-deployment --checkout-sha "$(git rev-parse HEAD)"
          printf 'source_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  release-readiness:
    needs: assert-deployment-input
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment || 'dev' }}
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
      reason: ${{ steps.readiness.outputs.reason }}
    steps:
      - id: readiness
        name: Check explicit environment bootstrap readiness without reading credentials
        env:
          DEPLOYMENT_READY: ${{ vars.DEPLOYMENT_READY }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOYMENT_READY" == true ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'reason=explicit environment bootstrap is ready' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'reason=DEPLOYMENT_READY is not true; no provider command was invoked' >> "$GITHUB_OUTPUT"
          fi

  write-skipped-release-receipts:
    needs: [assert-deployment-input, release-readiness]
    if: needs.release-readiness.outputs.ready != 'true'
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.0
        with:
          ref: ${{ needs.assert-deployment-input.outputs.source_sha }}
          fetch-depth: 1
      - name: Record the unconfigured release as skipped without provider credentials
        env:
          SOURCE_SHA: ${{ needs.assert-deployment-input.outputs.source_sha }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          REASON: ${{ needs.release-readiness.outputs.reason }}
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for provider in cloudflare railway modal terraform-foundation; do
            node scripts/deployment/controller.mjs receipt \
              --provider "$provider" \
              --environment "$DEPLOYMENT_ENVIRONMENT" \
              --source-sha "$SOURCE_SHA" \
              --status skipped \
              --started-at "$started_at" \
              --completed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --details "{\"reason\":\"$REASON\"}" \
              --output "receipts/$provider-$DEPLOYMENT_ENVIRONMENT.json"
          done
      - name: Upload skipped release receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-receipts-skipped-${{ inputs.environment || 'dev' }}-${{ needs.assert-deployment-input.outputs.source_sha }}
          path: receipts/
          if-no-files-found: error
          retention-days: 30

  terraform-foundation:
    needs: [assert-deployment-input, release-readiness]
    if: needs.release-readiness.outputs.ready == 'true'
    uses: ./.github/workflows/terraform-foundation.yml
    with:
      environment: ${{ inputs.environment || 'dev' }}
      source_sha: ${{ needs.assert-deployment-input.outputs.source_sha }}

  railway:
    needs: [assert-deployment-input, release-readiness, terraform-foundation]
    if: needs.release-readiness.outputs.ready == 'true'
    uses: ./.github/workflows/provider-railway.yml
    with:
      environment: ${{ inputs.environment || 'dev' }}
      source_sha: ${{ needs.assert-deployment-input.outputs.source_sha }}

  modal:
    needs: [assert-deployment-input, release-readiness, railway]
    if: needs.release-readiness.outputs.ready == 'true'
    uses: ./.github/workflows/provider-modal.yml
    with:
      environment: ${{ inputs.environment || 'dev' }}
      source_sha: ${{ needs.assert-deployment-input.outputs.source_sha }}

  cloudflare:
    needs: [assert-deployment-input, release-readiness, modal]
    if: needs.release-readiness.outputs.ready == 'true'
    uses: ./.github/workflows/provider-cloudflare.yml
    with:
      environment: ${{ inputs.environment || 'dev' }}
      source_sha: ${{ needs.assert-deployment-input.outputs.source_sha }}
