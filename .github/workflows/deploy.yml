name: Reviewed deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment for recovery/retry only; main pushes use dev
        required: false
        type: choice
        options: [dev, staging, production]
      source_sha:
        description: Full immutable commit SHA for recovery/retry; default is the triggering main commit
        required: false
        type: string
      reviewed_plan_sha256:
        description: Optional expected SHA-256 for a recovery plan; main pushes calculate and record it automatically
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: myth-maker-release-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  assert-deployment-input:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1
      - name: Refuse non-main, mutable, or dirty inputs
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git diff --exit-code
          git diff --cached --exit-code
          node scripts/deployment/controller.mjs validate --event "$EVENT_NAME" --provider cloudflare --environment "$DEPLOYMENT_ENVIRONMENT"

  modal:
    needs: assert-deployment-input
    uses: ./.github/workflows/provider-modal.yml
    with:
      environment: ${{ inputs.environment || 'dev' }}
      source_sha: ${{ inputs.source_sha || github.sha }}

  terraform-foundation:
    needs: assert-deployment-input
    uses: ./.github/workflows/terraform-foundation.yml
    with:
      environment: ${{ inputs.environment || 'dev' }}
      source_sha: ${{ inputs.source_sha || github.sha }}
      reviewed_plan_sha256: ${{ inputs.reviewed_plan_sha256 || '' }}

  railway:
    needs: terraform-foundation
    uses: ./.github/workflows/provider-railway.yml
    with:
      environment: ${{ inputs.environment || 'dev' }}
      source_sha: ${{ inputs.source_sha || github.sha }}

  cloudflare:
    needs: [terraform-foundation, railway, modal]
    uses: ./.github/workflows/provider-cloudflare.yml
    with:
      environment: ${{ inputs.environment || 'dev' }}
      source_sha: ${{ inputs.source_sha || github.sha }}
