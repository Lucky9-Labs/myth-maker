name: Reviewed deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Reviewed GitHub Environment to deploy to
        required: true
        type: choice
        options: [dev, staging, production]
      source_sha:
        description: Full immutable commit SHA already merged into main
        required: true
        type: string

permissions:
  contents: read

jobs:
  assert-deployment-input:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.0
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
      - name: Refuse non-main, mutable, or dirty inputs
        shell: bash
        run: |
          set -euo pipefail
          source_sha='${{ inputs.source_sha }}'
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$source_sha"
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$source_sha" origin/main
          git diff --exit-code
          git diff --cached --exit-code
          node scripts/deployment/controller.mjs validate --event workflow_dispatch --provider cloudflare --environment '${{ inputs.environment }}'

  modal:
    needs: assert-deployment-input
    uses: ./.github/workflows/provider-modal.yml
    with:
      environment: ${{ inputs.environment }}
      source_sha: ${{ inputs.source_sha }}

  railway:
    needs: assert-deployment-input
    uses: ./.github/workflows/provider-railway.yml
    with:
      environment: ${{ inputs.environment }}
      source_sha: ${{ inputs.source_sha }}

  cloudflare:
    needs: [railway, modal]
    uses: ./.github/workflows/provider-cloudflare.yml
    with:
      environment: ${{ inputs.environment }}
      source_sha: ${{ inputs.source_sha }}
