name: CI-owned deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment for an immutable main retry; pushes use dev
        required: false
        type: choice
        options: [dev, staging, production]

permissions:
  contents: read
  id-token: write

concurrency:
  group: myth-maker-release-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  assert-deployment-input:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.trust.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Derive and validate the trusted immutable main revision
        id: trust
        shell: bash
        run: |
          set -euo pipefail
          node scripts/deployment/controller.mjs assert-github-deployment
          printf 'source_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  write-unavailable-provider-receipts:
    needs: assert-deployment-input
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.0
        with:
          ref: ${{ needs.assert-deployment-input.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Record unactivated providers as skipped without provider credentials
        env:
          SOURCE_SHA: ${{ needs.assert-deployment-input.outputs.source_sha }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for provider in cloudflare railway terraform-foundation; do
            node scripts/deployment/controller.mjs receipt \
              --provider "$provider" \
              --environment "$DEPLOYMENT_ENVIRONMENT" \
              --source-sha "$SOURCE_SHA" \
              --status skipped \
              --started-at "$started_at" \
              --completed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --details "{\"reason\":\"provider is unavailable or unauthenticated; Modal deployment proceeds independently\"}" \
              --output "receipts/$provider-$DEPLOYMENT_ENVIRONMENT.json"
          done
      - name: Upload unavailable-provider receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-receipts-unavailable-${{ inputs.environment || 'dev' }}-${{ needs.assert-deployment-input.outputs.source_sha }}
          path: receipts/
          if-no-files-found: error
          retention-days: 30

  railway:
    needs: assert-deployment-input
    # GitHub Environment secrets are resolved on this top-level job. They are
    # not available to a reusable workflow merely because its nested executor
    # declares the same Environment.
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment || 'dev' }}
    concurrency:
      group: myth-maker-deploy-railway-${{ inputs.environment || 'dev' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.0
        with:
          ref: ${{ needs.assert-deployment-input.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Derive and validate the trusted immutable main revision in the Railway executor
        id: preflight
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.assert-deployment-input.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          node scripts/deployment/controller.mjs assert-github-deployment
          printf 'started_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Deploy and verify the Railway HTTP dispatcher
        id: railway
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          RESULT: ${{ runner.temp }}/provider-result.json
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
        run: |
          set -euo pipefail
          npm install --global @railway/cli@4.16.1
          node scripts/deployment/controller.mjs deploy --provider railway --environment "$DEPLOYMENT_ENVIRONMENT" > "$RESULT"
          node -e 'const result = require(process.env.RESULT); process.stdout.write(`provider_status=${result.status}\n`)' >> "$GITHUB_OUTPUT"
      - name: Write machine-readable Railway receipt from provider output
        if: always()
        shell: bash
        env:
          RAILWAY_OUTCOME: ${{ steps.railway.outcome }}
          RAILWAY_STATUS: ${{ steps.railway.outputs.provider_status }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          SOURCE_SHA: ${{ needs.assert-deployment-input.outputs.source_sha }}
          STARTED_AT: ${{ steps.preflight.outputs.started_at }}
          RESULT: ${{ runner.temp }}/provider-result.json
        run: |
          set -euo pipefail
          status=failure
          if [[ "$PREFLIGHT_OUTCOME" == success && "$RAILWAY_OUTCOME" == success && "$RAILWAY_STATUS" == deployed ]]; then
            status=success
          fi
          trusted_github_context=false
          if [[ "$PREFLIGHT_OUTCOME" == success ]]; then
            trusted_github_context=true
          fi
          details="$(node -e '
            const fs = require("node:fs");
            let result = {};
            try {
              if (fs.existsSync(process.env.RESULT) && fs.statSync(process.env.RESULT).size > 0) {
                result = JSON.parse(fs.readFileSync(process.env.RESULT, "utf8"));
              }
            } catch {}
            process.stdout.write(JSON.stringify(result.evidence ? { provider_evidence: result.evidence } : { reason: result.reason || "provider command did not produce verified evidence" }));
          ')"
          node scripts/deployment/controller.mjs receipt \
            --provider railway \
            --environment "$DEPLOYMENT_ENVIRONMENT" \
            --source-sha "$SOURCE_SHA" \
            --status "$status" \
            --started-at "${STARTED_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}" \
            --completed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --verification "{\"trusted_github_context\":$trusted_github_context,\"provider_command_outcome\":\"$RAILWAY_OUTCOME\",\"provider_result\":\"$RAILWAY_STATUS\"}" \
            --details "$details" \
            --output "receipts/railway-$DEPLOYMENT_ENVIRONMENT.json"
      - name: Upload deployment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-receipt-railway-${{ inputs.environment || 'dev' }}-${{ needs.assert-deployment-input.outputs.source_sha }}
          path: receipts/railway-${{ inputs.environment || 'dev' }}.json
          if-no-files-found: error
          retention-days: 30
  cloudflare:
    needs: assert-deployment-input
    # Like Railway and Modal, these Environment secrets must be resolved by the
    # first-level job rather than a nested reusable provider executor.
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment || 'dev' }}
    concurrency:
      group: myth-maker-deploy-cloudflare-${{ inputs.environment || 'dev' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.0
        with:
          ref: ${{ needs.assert-deployment-input.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Derive and validate the trusted immutable main revision in the Cloudflare executor
        id: preflight
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.assert-deployment-input.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          node scripts/deployment/controller.mjs assert-github-deployment
          printf 'started_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Bind discovery and dispatcher credentials and deploy the immutable Cloudflare Worker version
        id: deploy
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          RESULT: ${{ runner.temp }}/provider-result.json
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AGENT_INGRESS_TOKEN: ${{ secrets.AGENT_INGRESS_TOKEN }}
          WORK_DISPATCH_TOKEN: ${{ secrets.WORK_DISPATCH_TOKEN }}
          WORK_DISPATCH_URL: ${{ vars.WORK_DISPATCH_URL }}
          PACKAGE_DISCOVERY_SIGNING_PRIVATE_KEY: ${{ secrets.PACKAGE_DISCOVERY_SIGNING_PRIVATE_KEY }}
          CATALOG_ACCEPTANCE_TOKEN: ${{ secrets.CATALOG_ACCEPTANCE_TOKEN }}
          CLOUDFLARE_DISCOVERY_ENCOUNTER_ID: ${{ vars.CLOUDFLARE_DISCOVERY_ENCOUNTER_ID || 'ci-discovery-001' }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_DISCOVERY_ENCOUNTER_ID"
          node scripts/deployment/controller.mjs deploy --provider cloudflare --environment "$DEPLOYMENT_ENVIRONMENT" > "$RESULT"
          node -e 'const result = require(process.env.RESULT); process.stdout.write(`CLOUDFLARE_WORKER_URL=${result.evidence.worker_url}\n`)' >> "$GITHUB_ENV"
          node -e 'const result = require(process.env.RESULT); process.stdout.write(`provider_status=${result.status}\n`)' >> "$GITHUB_OUTPUT"
      - name: Verify authenticated encounter-scoped package discovery live
        id: discovery
        shell: bash
        env:
          RESULT: ${{ runner.temp }}/provider-result.json
          RESPONSE: ${{ runner.temp }}/cloudflare-package-discovery.json
          EVIDENCE: ${{ runner.temp }}/cloudflare-package-discovery-evidence.json
          CLOUDFLARE_DISCOVERY_ENCOUNTER_ID: ${{ vars.CLOUDFLARE_DISCOVERY_ENCOUNTER_ID || 'ci-discovery-001' }}
          PACKAGE_DISCOVERY_SIGNING_PUBLIC_KEY: MCowBQYDK2VwAyEAt1H5uJR0eCDxb2C4uHf+vRovjT9UJtCr5VBVYit1rgM=
          AGENT_INGRESS_TOKEN: ${{ secrets.AGENT_INGRESS_TOKEN }}
        run: |
          set -euo pipefail
          request_id="ci-discovery-${GITHUB_SHA:0:16}"
          response_url="${CLOUDFLARE_WORKER_URL%/}/v1/encounters/${CLOUDFLARE_DISCOVERY_ENCOUNTER_ID}/package-discoveries"
          curl_config="$RUNNER_TEMP/cloudflare-package-discovery.curl"
          trap 'rm -f "$curl_config"' EXIT
          umask 077
          printf 'header = "authorization: Bearer %s"\n' "$AGENT_INGRESS_TOKEN" > "$curl_config"
          curl --config "$curl_config" --fail-with-body --silent --show-error --max-time 30 \
            --request POST "$response_url" \
            --header "content-type: application/json" \
            --data "{\"schema_version\":\"1\",\"request_id\":\"$request_id\",\"idempotency_key\":\"$request_id\",\"host_capabilities\":{\"schema_version\":\"1\",\"host_id\":\"ci-host\",\"host_build\":\"$GITHUB_SHA\",\"platform\":\"linux\",\"scripting_backend\":\"il2cpp\",\"execution_kinds\":[\"runtime_asset\"],\"loaders\":[\"gltf\",\"urp\"],\"contracts\":[\"encounter.module.v1\"],\"limits\":{\"memory_mb\":1024,\"preload_seconds\":30,\"artifact_bytes\":52428800,\"actors\":8}}}" \
            --output "$RESPONSE"
          REQUEST_ID="$request_id" node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { verifyCloudflareDiscoveryResponse } from "./scripts/deployment/controller.mjs";
            const response = JSON.parse(readFileSync(process.env.RESPONSE, "utf8"));
            writeFileSync(process.env.EVIDENCE, JSON.stringify(await verifyCloudflareDiscoveryResponse(response, {
              encounterId: process.env.CLOUDFLARE_DISCOVERY_ENCOUNTER_ID,
              requestId: process.env.REQUEST_ID,
              signingPublicKey: process.env.PACKAGE_DISCOVERY_SIGNING_PUBLIC_KEY,
            })));
          '
          node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync(process.env.RESULT, "utf8"));
            const discovery = JSON.parse(fs.readFileSync(process.env.EVIDENCE, "utf8"));
            result.evidence = { ...result.evidence, discovery };
            fs.writeFileSync(process.env.RESULT, JSON.stringify(result));
          '
      - name: Write machine-readable Cloudflare receipt from provider output
        if: always()
        shell: bash
        env:
          CLOUDFLARE_OUTCOME: ${{ steps.deploy.outcome }}
          CLOUDFLARE_STATUS: ${{ steps.deploy.outputs.provider_status }}
          CLOUDFLARE_DISCOVERY_OUTCOME: ${{ steps.discovery.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          SOURCE_SHA: ${{ needs.assert-deployment-input.outputs.source_sha }}
          STARTED_AT: ${{ steps.preflight.outputs.started_at }}
          RESULT: ${{ runner.temp }}/provider-result.json
        run: |
          set -euo pipefail
          status=failure
          if [[ "$PREFLIGHT_OUTCOME" == success && "$CLOUDFLARE_OUTCOME" == success && "$CLOUDFLARE_STATUS" == deployed && "$CLOUDFLARE_DISCOVERY_OUTCOME" == success ]]; then
            status=success
          fi
          details="$(node -e '
            const fs = require("node:fs");
            let result = {};
            try {
              if (fs.existsSync(process.env.RESULT) && fs.statSync(process.env.RESULT).size > 0) result = JSON.parse(fs.readFileSync(process.env.RESULT, "utf8"));
            } catch {}
            process.stdout.write(JSON.stringify(result.evidence ? { provider_evidence: result.evidence } : { reason: result.reason || "provider command did not produce verified evidence" }));
          ')"
          node scripts/deployment/controller.mjs receipt \
            --provider cloudflare \
            --environment "$DEPLOYMENT_ENVIRONMENT" \
            --source-sha "$SOURCE_SHA" \
            --status "$status" \
            --started-at "${STARTED_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}" \
            --completed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --verification "{\"trusted_github_context\":$([[ "$PREFLIGHT_OUTCOME" == success ]] && echo true || echo false),\"provider_command_outcome\":\"$CLOUDFLARE_OUTCOME\",\"provider_result\":\"$CLOUDFLARE_STATUS\",\"live_discovery_outcome\":\"$CLOUDFLARE_DISCOVERY_OUTCOME\"}" \
            --details "$details" \
            --output "receipts/cloudflare-$DEPLOYMENT_ENVIRONMENT.json"
      - name: Upload deployment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-receipt-cloudflare-${{ inputs.environment || 'dev' }}-${{ needs.assert-deployment-input.outputs.source_sha }}
          path: receipts/cloudflare-${{ inputs.environment || 'dev' }}.json
          if-no-files-found: error
          retention-days: 30
  modal:
    needs: assert-deployment-input
    # Keep this job in the top-level workflow. GitHub resolves Environment
    # secrets here; a reusable workflow receives empty values for these
    # credentials even when it declares the same Environment.
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment || 'dev' }}
    concurrency:
      group: myth-maker-deploy-modal-${{ inputs.environment || 'dev' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.0
        with:
          ref: ${{ needs.assert-deployment-input.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Derive and validate the trusted immutable main revision in the Modal executor
        id: preflight
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.assert-deployment-input.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          node scripts/deployment/controller.mjs assert-github-deployment
          printf 'started_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Install the pinned Modal control-plane client
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Modal client for the CI-owned activation controller
        run: python3 -m pip install --disable-pip-version-check 'modal==1.5.5'
      - name: Bootstrap, deploy, verify, and observe one bounded Modal work order
        id: modal
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          RESULT: ${{ runner.temp }}/provider-result.json
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODAL_IMAGE_BUILDER_VERSION: '2024.04'
          MODAL_EVIDENCE_PATH: ${{ runner.temp }}/modal-deployment-evidence.json
        run: |
          set -euo pipefail
          node scripts/deployment/controller.mjs deploy --provider modal --environment "$DEPLOYMENT_ENVIRONMENT" > "$RESULT"
          node -e 'const result = require(process.env.RESULT); process.stdout.write(`provider_status=${result.status}\n`)' >> "$GITHUB_OUTPUT"
      - name: Write machine-readable Modal receipt from provider output
        if: always()
        shell: bash
        env:
          MODAL_OUTCOME: ${{ steps.modal.outcome }}
          MODAL_STATUS: ${{ steps.modal.outputs.provider_status }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          SOURCE_SHA: ${{ needs.assert-deployment-input.outputs.source_sha }}
          STARTED_AT: ${{ steps.preflight.outputs.started_at }}
          RESULT: ${{ runner.temp }}/provider-result.json
        run: |
          set -euo pipefail
          status=failure
          if [[ "$PREFLIGHT_OUTCOME" == success && "$MODAL_OUTCOME" == success && "$MODAL_STATUS" == deployed ]]; then
            status=success
          fi
          trusted_github_context=false
          if [[ "$PREFLIGHT_OUTCOME" == success ]]; then
            trusted_github_context=true
          fi
          details="$(node -e '
            const fs = require("node:fs");
            let result = {};
            try {
              if (fs.existsSync(process.env.RESULT) && fs.statSync(process.env.RESULT).size > 0) {
                result = JSON.parse(fs.readFileSync(process.env.RESULT, "utf8"));
              }
            } catch {}
            process.stdout.write(JSON.stringify(result.evidence ? { provider_evidence: result.evidence } : { reason: result.reason || "provider command did not produce verified evidence" }));
          ')"
          node scripts/deployment/controller.mjs receipt \
            --provider modal \
            --environment "$DEPLOYMENT_ENVIRONMENT" \
            --source-sha "$SOURCE_SHA" \
            --status "$status" \
            --started-at "${STARTED_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}" \
            --completed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --verification "{\"trusted_github_context\":$trusted_github_context,\"provider_command_outcome\":\"$MODAL_OUTCOME\",\"provider_result\":\"$MODAL_STATUS\"}" \
            --details "$details" \
            --output "receipts/modal-$DEPLOYMENT_ENVIRONMENT.json"
      - name: Upload deployment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-receipt-modal-${{ inputs.environment || 'dev' }}-${{ needs.assert-deployment-input.outputs.source_sha }}
          path: receipts/modal-${{ inputs.environment || 'dev' }}.json
          if-no-files-found: error
          retention-days: 30

  observed-deterministic-modal-blender:
    # This is deliberately in the trusted main deployment workflow, after its
    # Modal activation job. It never consumes an external event payload or
    # checks out an event-provided ref in a credentialed context.
    needs: [assert-deployment-input, modal]
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment || 'dev' }}
    concurrency:
      group: myth-maker-observed-modal-${{ inputs.environment || 'dev' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.0
        with:
          ref: ${{ needs.assert-deployment-input.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the pinned Modal client
        run: python3 -m pip install --disable-pip-version-check 'modal==1.5.5'
      - name: Submit the secretless deterministic Blender work order
        id: draft
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          GITHUB_SHA: ${{ needs.assert-deployment-input.outputs.source_sha }}
          OBSERVED_MODAL_JOB_ID: deterministic-encounter-demo-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/observed_modal_blender_demo.py
      - name: Retrieve provider-persisted source and Blender frames
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          JOB_ID: ${{ steps.draft.outputs.job_id }}
          WORK_ID: ${{ steps.draft.outputs.work_id }}
        run: |
          set -euo pipefail
          mkdir -p provider-evidence/modal-blender-demo
          modal volume get myth-maker-encounter-submissions "$JOB_ID/output/$WORK_ID.blend" provider-evidence/modal-blender-demo/source.blend --env dev
          modal volume get myth-maker-encounter-submissions "$JOB_ID/output/$WORK_ID.glb" provider-evidence/modal-blender-demo/encounter.glb --env dev
          modal volume get myth-maker-encounter-submissions "$JOB_ID/frames/000-initial.png" provider-evidence/modal-blender-demo/initial.png --env dev
          modal volume get myth-maker-encounter-submissions "$JOB_ID/frames/010-appendages.png" provider-evidence/modal-blender-demo/intermediate.png --env dev
          modal volume get myth-maker-encounter-submissions "$JOB_ID/frames/020-final.png" provider-evidence/modal-blender-demo/final.png --env dev
      - name: Verify downloaded provider bytes against the terminal receipt
        run: python3 scripts/verify_observed_modal_artifacts.py --receipt provider-evidence/modal-blender-demo-receipt.json --artifact-dir provider-evidence/modal-blender-demo
      - name: Upload observed Modal Blender evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: observed-modal-blender-demo-${{ needs.assert-deployment-input.outputs.source_sha }}-${{ github.run_id }}
          path: provider-evidence/
          if-no-files-found: error
          retention-days: 30
