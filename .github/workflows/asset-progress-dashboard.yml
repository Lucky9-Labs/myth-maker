name: Asset progress dashboard

on:
  workflow_dispatch:
    inputs:
      evaluate:
        description: Run the paid Astra reference evaluation before building the dashboard
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: asset-progress-dashboard-dev
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    environment: dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned Modal client
        run: python3 -m pip install --disable-pip-version-check 'modal==1.5.5'
      - name: Fetch private cloud dashboard
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          EVALUATE: ${{ inputs.evaluate }}
        run: |
          set -euo pipefail
          args=(--environment dev --run-id raptor-mech-railgun-pilot-001 --output output/asset-progress)
          effective_evaluate="${EVALUATE:-true}"
          if [[ "$effective_evaluate" != "true" ]]; then
            args+=(--skip-evaluation)
          fi
          python3 scripts/fetch_asset_progress_dashboard.py "${args[@]}"
      - name: Upload dashboard snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: raptor-mech-railgun-progress-${{ github.run_id }}
          path: output/asset-progress
          if-no-files-found: error
          retention-days: 7
