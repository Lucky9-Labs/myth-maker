name: Observe asset component diffusion

on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
      work_id:
        required: true
        type: string
      attempt:
        required: true
        type: number

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check 'modal==1.5.5'
      - name: Read persisted attempt status
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          python3 scripts/get_component_diffusion_status.py \
            --run-id '${{ inputs.run_id }}' \
            --work-id '${{ inputs.work_id }}' \
            --attempt '${{ inputs.attempt }}' \
            --output receipts/component-diffusion-status.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: component-diffusion-status-${{ github.run_id }}
          path: receipts/component-diffusion-status.json
          retention-days: 30
